apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// Dynamic .env selection based on ENVIRONMENT variable (default: development)
def selectedEnv = System.getenv("ENVIRONMENT") ?: "development"
def envFile = ".env.${selectedEnv}"

println "Building with environment: ${selectedEnv} -> ${envFile}"

project.ext.envConfigFiles = [
    debug: envFile,
    release: envFile,
    anothercustombuild: envFile,
]

// Apply react-native-config plugin
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")



    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.lateralflowscannermobile"
    
    // Use short path for CMake build to work around Windows 260 character path limit
    externalNativeBuild {
        cmake {
            buildStagingDirectory "D:/rn-build"
        }
    }
    defaultConfig {
        applicationId "com.lateralflowscannermobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", (findProperty("newArchEnabled") ?: "false").toString()
        buildConfigField "boolean", "IS_HERMES_ENABLED", (findProperty("hermesEnabled") ?: "true").toString()

        externalNativeBuild {
            cmake {
                cppFlags "-O2 -frtti -fexceptions -Wall -fstack-protector-all"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                abiFilters "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
    }

    // Use short path to avoid Windows 260 char limit
    externalNativeBuild {
        cmake {
            buildStagingDirectory "D:/rn-build"
        }
    }

    // Rename release output files to LFS.apk and LFS.aab
    applicationVariants.all { variant ->
        variant.outputs.all {
            if (variant.buildType.name == "release") {
                outputFileName = "LFS.apk"
            }
        }
    }
}

// Note: Hermes is provided by React Native 0.83+ automatically

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    
    // Note: VisionCamera and other React Native libraries are auto-linked
    
    // VisionCamera: Manual implementation because we disabled autolinking to fix build loop
    implementation project(':react-native-vision-camera')

    // OpenCV - commented out as it requires manual setup
    // OpenCV (via QuickBirdStudios wrapper for easy integration)
    // OpenCV - compileOnly allows us to compile against it, but relies on react-native-fast-opencv for the runtime AAR.
    compileOnly 'org.opencv:opencv:4.12.0'

    // Camera2 API
    implementation 'androidx.camera:camera-core:1.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.camera:camera-view:1.3.0'

    // ExifInterface
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    // Note: Flipper removed as it's deprecated in React Native 0.73+

    if (!hermesEnabled.toBoolean()) {
        implementation jscFlavor
    }
}

// Rename AAB bundle to LFS.aab after bundleRelease
// Rename AAB bundle to LFS.aab after bundleRelease
afterEvaluate {
    def bundleTask = tasks.findByName("bundleRelease")
    if (bundleTask) {
        bundleTask.doLast {
            def bundleDir = file("${project.buildDir}/outputs/bundle/release")
            def originalFile = new File(bundleDir, "app-release.aab")
            def renamedFile = new File(bundleDir, "LFS.aab")
            
            println "Looking for AAB at: ${originalFile.absolutePath}"
            
            if (originalFile.exists()) {
                def result = originalFile.renameTo(renamedFile)
                if (result) {
                    println "AAB Rename Success: app-release.aab -> LFS.aab"
                } else {
                    println "AAB Rename Failed: Could not rename file."
                }
            } else {
                println "AAB Rename Warning: File not found at ${originalFile.absolutePath}"
            }
        }
    }
}
