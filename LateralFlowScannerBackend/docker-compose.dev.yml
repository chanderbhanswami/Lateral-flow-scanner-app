version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  backend:
    build:
      context: ./lateral-flow-backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/lateral_flow_scanner?authSource=admin
      REDIS_URL: redis://redis:6379
    volumes:
      - ./lateral-flow-backend/src:/app/src
      - ./lateral-flow-backend/node_modules:/app/node_modules

volumes:
  mongodb_dev_data:
  redis_dev_data:
