name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: lateral-flow-scanner-mobile/package-lock.json
      
      - name: Install dependencies
        working-directory: ./lateral-flow-scanner-mobile
        run: npm ci
      
      - name: Run TypeScript check
        working-directory: ./lateral-flow-scanner-mobile
        run: npm run type-check
      
      - name: Run linter
        working-directory: ./lateral-flow-scanner-mobile
        run: npm run lint
      
      - name: Run tests
        working-directory: ./lateral-flow-scanner-mobile
        run: npm test

  test-backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: lateral-flow-backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./lateral-flow-backend
        run: npm ci
      
      - name: Run TypeScript check
        working-directory: ./lateral-flow-backend
        run: npm run type-check
      
      - name: Run linter
        working-directory: ./lateral-flow-backend
        run: npm run lint
      
      - name: Run tests
        working-directory: ./lateral-flow-backend
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          REDIS_URL: redis://localhost:6379

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        working-directory: ./lateral-flow-scanner-mobile
        run: npm ci
      
      - name: Build Android
        working-directory: ./lateral-flow-scanner-mobile/android
        run: ./gradlew assembleRelease

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./lateral-flow-scanner-mobile
        run: npm ci
      
      - name: Install Pods
        working-directory: ./lateral-flow-scanner-mobile/ios
        run: pod install
      
      - name: Build iOS
        working-directory: ./lateral-flow-scanner-mobile/ios
        run: xcodebuild -workspace LateralFlowScanner.xcworkspace -scheme LateralFlowScanner -configuration Release